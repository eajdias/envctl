# shell.yaml - Declarative Shell, Environment & Configuration Files
version: "1.0"

environment_variables:
  - name: MSYS2_PATH_TYPE
    value: inherit
    scope: User
    target: "Windows User Environment"
    os: windows

  - name: FZF_DEFAULT_COMMAND
    value: "fd --type f --hidden --exclude .git"
    scope: User
    target: "Windows User Environment"

  - name: NODE_PATH
    value: "%USERPROFILE%\\node_modules"
    scope: User
    target: "Windows User Environment"
    os: windows

  - name: MSYS2_ENV_CONV_EXCL
    value: "NODE_PATH"
    scope: User
    target: "Windows User Environment"
    os: windows

  - name: MSYS2_ARG_CONV_EXCL
    value: "/bin;/usr;/var;/etc;/app;/tmp;/opt;--entrypoint;-v;--volume;--mount;--workdir;-w"
    scope: User
    target: "Windows User Environment"
    os: windows

config_files:
  - id: bashrc
    description: "MSYS2 Bash interactive configuration with aliases and completions"
    source: "configs/.bashrc"
    destination: "~/.bashrc"
    strict_acl: false
    category: "shell"
    os: windows

  - id: bash_profile
    description: "MSYS2 Bash login profile ensuring .bashrc is sourced"
    source: "configs/.bash_profile"
    destination: "~/.bash_profile"
    strict_acl: false
    category: "shell"
    os: windows

  - id: nsswitch_conf
    description: "MSYS2 NSSwitch configuration unifying home directory with Windows (%USERPROFILE%)"
    source: "configs/nsswitch.conf"
    destination: "C:/msys64/etc/nsswitch.conf"
    strict_acl: false
    category: "msys2"
    os: windows

  - id: msys_pathconv_profile
    description: "MSYS2 Profile script bypassing argument path conversion for container paths"
    source: "configs/msys_pathconv.sh"
    destination: "C:/msys64/etc/profile.d/msys_pathconv.sh"
    strict_acl: false
    category: "msys2"
    os: windows

  - id: opencode_config
    description: "OpenCode global agent configuration with full LSP registration"
    source: "configs/opencode.jsonc"
    destination: "~/.config/opencode/opencode.jsonc"
    strict_acl: false
    category: "opencode"
    os: windows

  - id: opencode_config_linux
    description: "OpenCode global agent configuration for Linux (no Windows shell/MCP/LSP)"
    source: "configs/opencode.linux.jsonc"
    destination: "~/.config/opencode/opencode.jsonc"
    strict_acl: false
    category: "opencode"
    os: linux

  - id: agents_manifest
    description: "OpenCode global rules manifesto (auto-loaded from ~/.config/opencode/AGENTS.md)"
    source: "configs/AGENTS.md"
    destination: "~/.config/opencode/AGENTS.md"
    strict_acl: false
    category: "opencode"
    os: windows

  - id: agents_manifest_linux
    description: "OpenCode global rules manifesto for Linux VPS servers"
    source: "configs/AGENTS.linux.md"
    destination: "~/.config/opencode/AGENTS.md"
    strict_acl: false
    category: "opencode"
    os: linux

  - id: opencode_dcp
    description: "OpenCode Dynamic Context Pruning configuration"
    source: "configs/dcp.jsonc"
    destination: "~/.config/opencode/dcp.jsonc"
    strict_acl: false
    category: "opencode"

  - id: opencode_tui
    description: "OpenCode TUI plugins configuration"
    source: "configs/tui.json"
    destination: "~/.config/opencode/tui.json"
    strict_acl: false
    category: "opencode"

  - id: opencode_package_json
    description: "OpenCode plugins dependency declaration"
    source: "configs/package.json"
    destination: "~/.config/opencode/package.json"
    strict_acl: false
    category: "opencode"

  - id: user_package_json
    description: "User root package.json for Playwright API and agent automations"
    source: "configs/user-package.json"
    destination: "~/package.json"
    strict_acl: false
    category: "runtimes"

  - id: agents_skill_lock
    description: "OpenCode agent skills lock tracking 36 external tools"
    source: "configs/.skill-lock.json"
    destination: "~/.agents/.skill-lock.json"
    strict_acl: false
    category: "opencode"

  - id: windows_terminal_settings
    description: "Windows Terminal profile configuration (MSYS2 default, MesloLGM Nerd Font, Dark+ theme)"
    source: "configs/terminal-settings.json"
    destination: "%LOCALAPPDATA%/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
    strict_acl: false
    category: "terminal"
    os: windows

  - id: powershell_profile
    description: "PowerShell Profile with Oh-My-Posh & GitHub CLI autocompletions"
    source: "configs/Microsoft.PowerShell_profile.ps1"
    destination: "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
    strict_acl: false
    category: "terminal"
    os: windows

  - id: vscode_settings
    description: "Visual Studio Code global user preferences"
    source: "configs/vscode-settings.json"
    destination: "%APPDATA%/Code/User/settings.json"
    strict_acl: false
    category: "editor"
    os: windows

  - id: ohmyposh_theme
    description: "Oh-My-Posh JandeDobbeleer prompt theme"
    source: "configs/jandedobbeleer.omp.json"
    destination: "~/.poshthemes/jandedobbeleer.omp.json"
    strict_acl: false
    category: "terminal"

  - id: ssh_config
    description: "OpenSSH client configuration with connection caching and resilient defaults"
    source: "configs/ssh-config"
    destination: "~/.ssh/config"
    strict_acl: false
    category: "ssh"
    os: windows

  - id: ssh_config_linux
    description: "OpenSSH client configuration for Linux (no Windows-only key paths)"
    source: "configs/ssh-config.linux"
    destination: "~/.ssh/config"
    strict_acl: false
    category: "ssh"
    os: linux

  - id: pw_screenshot
    description: "Headless Playwright screenshot utility script"
    source: "configs/bin/pw-screenshot"
    destination: "~/.local/bin/pw-screenshot"
    strict_acl: false
    category: "scripts"

  - id: pw_screenshot_cmd
    description: "Windows CMD wrapper for pw-screenshot"
    source: "configs/bin/pw-screenshot.cmd"
    destination: "~/.local/bin/pw-screenshot.cmd"
    strict_acl: false
    category: "scripts"
    os: windows

  - id: pw_eval
    description: "Headless Playwright evaluation and page content extraction utility"
    source: "configs/bin/pw-eval"
    destination: "~/.local/bin/pw-eval"
    strict_acl: false
    category: "scripts"

  - id: pw_eval_cmd
    description: "Windows CMD wrapper for pw-eval"
    source: "configs/bin/pw-eval.cmd"
    destination: "~/.local/bin/pw-eval.cmd"
    strict_acl: false
    category: "scripts"
    os: windows

directories:
  - path: "~/Documents/SSH-keys"
    strict_acl: true
    description: "Restricted directory for VPS and server SSH private keys"
  - path: "~/.ssh-manager"
    strict_acl: true
    description: "Restricted directory for SSH Manager state and configs"
  - path: "~/.ssh"
    strict_acl: true
    description: "Standard user SSH configuration directory"
  - path: "~/.ssh/sockets"
    strict_acl: true
    description: "Control sockets directory for multiplexed SSH connections"
  - path: "~/.local/bin"
    strict_acl: false
    description: "User local binaries and custom CLI scripts"
  - path: "~/.config/opencode/skills"
    strict_acl: false
    description: "OpenCode agent skills directory"
  - path: "~/.config/opencode/memory"
    strict_acl: false
    description: "OpenCode agent memory directory (lessons and patterns)"
  - path: "~/.config/opencode/extras"
    strict_acl: false
    description: "OpenCode local extras (per-machine: ssh_servers.md, etc. — NEVER versioned)"
  - path: "~/.agents/skills"
    strict_acl: false
    description: "External agent skills directory"
  - path: "~/.poshthemes"
    strict_acl: false
    description: "Oh-My-Posh themes directory"
  - path: "C:/projetos/git-privado"
    strict_acl: false
    description: "Directory for private git projects"
    os: windows
  - path: "C:/projetos/git-publico"
    strict_acl: false
    description: "Directory for public open-source git projects"
    os: windows
