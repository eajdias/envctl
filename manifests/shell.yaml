# shell.yaml - Declarative Shell, Environment & Configuration Files
version: "1.0"

environment_variables:
  - name: FZF_DEFAULT_COMMAND
    value: "fd --type f --hidden --exclude .git"
    scope: User
    target: "Windows User Environment"
    os: windows

  - name: NODE_PATH
    value: "%USERPROFILE%\\node_modules"
    scope: User
    target: "Windows User Environment"
    os: windows

  - name: NODE_PATH
    value: "$HOME/node_modules"
    scope: User
    target: "Linux user profile"
    os: linux

  - name: ENVCTL_TEMP
    value: "C:\\temp"
    scope: User
    target: "Windows User Environment"
    os: windows

config_files:
  - id: opencode_config
    description: "OpenCode global agent configuration (single source of truth, PowerShell shell on Windows)"
    source: "configs/opencode.json"
    destination: "~/.config/opencode/opencode.json"
    strict_acl: false
    category: "opencode"
    os: windows

  - id: opencode_config_linux
    description: "OpenCode global agent configuration for Linux (no Windows shell/MCP/LSP)"
    source: "configs/opencode.linux.json"
    destination: "~/.config/opencode/opencode.json"
    strict_acl: false
    category: "opencode"
    os: linux

  - id: agents_manifest
    description: "OpenCode global rules manifesto (auto-loaded from ~/.config/opencode/AGENTS.md)"
    source: "configs/AGENTS.md"
    destination: "~/.config/opencode/AGENTS.md"
    strict_acl: false
    category: "opencode"
    os: windows

  - id: agents_manifest_linux
    description: "OpenCode global rules manifesto for Linux VPS servers"
    source: "configs/AGENTS.linux.md"
    destination: "~/.config/opencode/AGENTS.md"
    strict_acl: false
    category: "opencode"
    os: linux

  - id: opencode_skill_index
    description: "OpenCode skill index (situation -> skill); consulted on demand, NOT auto-loaded"
    source: "configs/SKILL-INDEX.md"
    destination: "~/.config/opencode/SKILL-INDEX.md"
    strict_acl: false
    category: "opencode"

  - id: opencode_reference
    description: "OpenCode operational reference (plugins, DCP, agents, memory, VPS, snippets); consulted on demand, NOT auto-loaded"
    source: "configs/REFERENCE.md"
    destination: "~/.config/opencode/REFERENCE.md"
    strict_acl: false
    category: "opencode"

  - id: opencode_dcp
    description: "OpenCode Dynamic Context Pruning configuration"
    source: "configs/dcp.jsonc"
    destination: "~/.config/opencode/dcp.jsonc"
    strict_acl: false
    category: "opencode"

  - id: opencode_package_json
    description: "OpenCode plugins dependency declaration"
    source: "configs/package.json"
    destination: "~/.config/opencode/package.json"
    strict_acl: false
    category: "opencode"

  - id: memory_lessons_template
    description: "Global agent memory lessons baseline (seed only, no PII — per-machine additions stay local)"
    source: "configs/memory/lessons.md"
    destination: "~/.config/opencode/memory/lessons.md"
    strict_acl: false
    category: "opencode"
    seed_if_missing: true

  - id: memory_patterns_template
    description: "Global agent memory patterns baseline (seed only, no PII — per-machine additions stay local)"
    source: "configs/memory/patterns.md"
    destination: "~/.config/opencode/memory/patterns.md"
    strict_acl: false
    category: "opencode"
    seed_if_missing: true

  # --- CommandCode Configs ---
  - id: commandcode_settings
    description: "CommandCode project settings (permissions, hooks)"
    source: "configs/commandcode/settings.json"
    destination: "~/.commandcode/settings.json"
    strict_acl: false
    category: "commandcode"

  - id: commandcode_agents_manifest
    description: "CommandCode global rules manifesto for Windows workstations (auto-loaded from ~/.commandcode/AGENTS.md)"
    source: "configs/commandcode/AGENTS.md"
    destination: "~/.commandcode/AGENTS.md"
    strict_acl: false
    category: "commandcode"
    os: windows

  - id: commandcode_agents_manifest_linux
    description: "CommandCode global rules manifesto for Linux VPS servers (no PowerShell/Windows paths)"
    source: "configs/commandcode/AGENTS.linux.md"
    destination: "~/.commandcode/AGENTS.md"
    strict_acl: false
    category: "commandcode"
    os: linux

  - id: commandcode_skill_index
    description: "CommandCode skill index (situation -> skill); consulted on demand, NOT auto-loaded"
    source: "configs/commandcode/SKILL-INDEX.md"
    destination: "~/.commandcode/SKILL-INDEX.md"
    strict_acl: false
    category: "commandcode"

  - id: commandcode_mcp
    description: "CommandCode user-scope MCP servers (context7; playwright, chrome-devtools, ssh-manager, zscan disabled by default)"
    source: "configs/commandcode/mcp.json"
    destination: "~/.commandcode/mcp.json"
    strict_acl: false
    category: "commandcode"

  - id: commandcode_agent_code_reviewer
    description: "CommandCode code-reviewer agent (read-only, evidencia file:line); nomes reservados (review/plan/general/explore) sao IGNORADOS pelo CommandCode"
    source: "configs/commandcode/agents/code-reviewer.md"
    destination: "~/.commandcode/agents/code-reviewer.md"
    strict_acl: false
    category: "commandcode"

  - id: user_package_json
    description: "User root package.json for agent automation libs (axios, cheerio, papaparse)"
    source: "configs/user-package.json"
    destination: "~/package.json"
    strict_acl: false
    category: "runtimes"

  - id: windows_terminal_settings
    description: "Windows Terminal profile configuration (PowerShell default, WSL Ubuntu, MesloLGM Nerd Font, Dark+ theme)"
    source: "configs/terminal-settings.json"
    destination: "%LOCALAPPDATA%/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
    strict_acl: false
    category: "terminal"
    os: windows

  - id: powershell_profile
    description: "PowerShell Profile with Oh-My-Posh & GitHub CLI autocompletions"
    source: "configs/Microsoft.PowerShell_profile.ps1"
    destination: "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
    strict_acl: false
    category: "terminal"
    os: windows

  - id: vscode_settings
    description: "Visual Studio Code global user preferences"
    source: "configs/vscode-settings.json"
    destination: "%APPDATA%/Code/User/settings.json"
    strict_acl: false
    category: "editor"
    os: windows

  - id: ohmyposh_theme
    description: "Oh-My-Posh JandeDobbeleer prompt theme"
    source: "configs/jandedobbeleer.omp.json"
    destination: "~/.poshthemes/jandedobbeleer.omp.json"
    strict_acl: false
    category: "terminal"

  - id: ssh_config
    description: "OpenSSH client configuration with connection caching and resilient defaults"
    source: "configs/ssh-config"
    destination: "~/.ssh/config"
    strict_acl: false
    category: "ssh"
    os: windows

  - id: ssh_config_linux
    description: "OpenSSH client configuration for Linux (no Windows-only key paths)"
    source: "configs/ssh-config.linux"
    destination: "~/.ssh/config"
    strict_acl: false
    category: "ssh"
    os: linux

directories:
  - path: "~/Documents/SSH-keys"
    strict_acl: true
    description: "Restricted directory for VPS and server SSH private keys"
  - path: "~/.ssh-manager"
    strict_acl: true
    description: "Restricted directory for SSH Manager state and configs"
  - path: "~/.ssh"
    strict_acl: true
    description: "Standard user SSH configuration directory"
  - path: "~/.ssh/sockets"
    strict_acl: true
    description: "Control sockets directory for multiplexed SSH connections"
  - path: "~/.local/bin"
    strict_acl: false
    description: "User local binaries and custom CLI scripts"
  - path: "~/.config/opencode/skills"
    strict_acl: false
    description: "OpenCode agent skills directory"
    category: "opencode"
  - path: "~/.config/opencode/memory"
    strict_acl: false
    description: "OpenCode agent memory directory (lessons and patterns)"
    category: "opencode"
  - path: "~/.config/opencode/secrets"
    strict_acl: true
    description: "OpenCode local secrets (context7.key etc. — NEVER versioned)"
    category: "opencode"
  - path: "~/.config/opencode/extras"
    strict_acl: false
    description: "OpenCode local extras (per-machine: ssh_servers.md, etc. — NEVER versioned)"
    category: "opencode"
  - path: "~/.commandcode/skills"
    strict_acl: false
    description: "CommandCode agent skills directory"
    category: "commandcode"
  - path: "~/.commandcode/agents"
    strict_acl: false
    description: "CommandCode agent definitions directory"
    category: "commandcode"
  - path: "~/.poshthemes"
    strict_acl: false
    description: "Oh-My-Posh themes directory"
  - path: "C:/projetos/git-privado"
    strict_acl: false
    description: "Directory for private git projects"
    os: windows
  - path: "C:/projetos/git-publico"
    strict_acl: false
    description: "Directory for public open-source git projects"
    os: windows
  - path: "C:/temp"
    strict_acl: false
    description: "Global standardized temp folder for OpenCode LLM agents (ENVCTL_TEMP)"
    os: windows
  - path: "/temp"
    strict_acl: false
    description: "Global standardized temp folder for OpenCode LLM agents (ENVCTL_TEMP)"
    os: linux

cleanup:
  - id: stale_opencode_jsonc
    description: "Remove stale opencode.jsonc (standardized on opencode.json)"
    path: "~/.config/opencode/opencode.jsonc"
    category: "opencode"
  - id: stale_tui_json
    description: "Remove non-functional TUI plugin config (tui.json)"
    path: "~/.config/opencode/tui.json"
    category: "opencode"
  - id: stale_opencode_agents_dir
    description: "Remove stale agent markdown definitions (agents now live in opencode.json only)"
    path: "~/.config/opencode/agents"
    category: "opencode"
    recursive: true
  - id: stale_commandcode_settings_jsonc
    description: "Remove stale CommandCode settings.jsonc (standardized on settings.json)"
    path: "~/.commandcode/settings.jsonc"
    category: "commandcode"
  - id: stale_commandcode_agent_review
    description: "Remove CommandCode agents/review.md (reserved name — ignored; superseded by code-reviewer)"
    path: "~/.commandcode/agents/review.md"
    category: "commandcode"
  - id: stale_commandcode_agent_plan
    description: "Remove CommandCode agents/plan.md (reserved name — ignored; built-in Plan covers it)"
    path: "~/.commandcode/agents/plan.md"
    category: "commandcode"
  - id: stale_commandcode_agent_goal
    description: "Remove CommandCode agents/goal.md (agent removed — build covers the flow)"
    path: "~/.commandcode/agents/goal.md"
    category: "commandcode"
  - id: stale_commandcode_memory_dir
    description: "Remove stale CommandCode memory dir (CommandCode has no memory-dir — memory lives in AGENTS.md)"
    path: "~/.commandcode/memory"
    category: "commandcode"
    recursive: true
  - id: stale_pw_screenshot
    description: "Remove pw-screenshot CLI (browser automation is MCP-only)"
    path: "~/.local/bin/pw-screenshot"
    category: "scripts"
  - id: stale_pw_screenshot_cmd
    description: "Remove pw-screenshot.cmd wrapper (browser automation is MCP-only)"
    path: "~/.local/bin/pw-screenshot.cmd"
    category: "scripts"
    os: windows
  - id: stale_pw_eval
    description: "Remove pw-eval CLI (browser automation is MCP-only)"
    path: "~/.local/bin/pw-eval"
    category: "scripts"
  - id: stale_pw_eval_cmd
    description: "Remove pw-eval.cmd wrapper (browser automation is MCP-only)"
    path: "~/.local/bin/pw-eval.cmd"
    category: "scripts"
    os: windows
  - id: prune_opencode_config_backups
    description: "Prune old .bak.* provisioning backups in ~/.config/opencode (keep newest per file)"
    path: "~/.config/opencode"
    category: "opencode"
    keep_newest: 1
  - id: prune_commandcode_config_backups
    description: "Prune old .bak.* provisioning backups in ~/.commandcode (keep newest per file)"
    path: "~/.commandcode"
    category: "commandcode"
    keep_newest: 1
