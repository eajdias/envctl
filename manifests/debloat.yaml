  # --- Services: stop & disable safe-only set (9 services) ---
  # Spooler (printing) and the remote-access/per-user services (AnyDesk,
  # Firebird*, Tailscale, sshd) stay out; the Xbox suite too. See
  # docs/guides/windows-debloat-tier3.md §9.
  - id: "svc-diagtrack"
    description: "Stop & disable Connected User Experiences and Telemetry"
