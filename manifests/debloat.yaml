    name: "lfsvc"
    value: "Disabled"
    type: "Service"
    category: "services"

  - id: "svc-sharedaccess"
    description: "Stop & disable Internet Connection Sharing"
    name: "SharedAccess"
    value: "Disabled"
    type: "Service"
    category: "services"

  - id: "svc-wisvc"
    description: "Stop & disable Windows Insider Service"
    name: "wisvc"
    value: "Disabled"
    type: "Service"
    category: "services"

  - id: "svc-retaildemo"
