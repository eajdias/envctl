    name: "WSAIFabricSvc"
    value: "Disabled"
    type: "Service"
    category: "services"

  # --- Services: Manual, not Disabled (11 services) ---
  # windows11-clean hard-disables most of these; envctl only relaxes the
  # startup type, so the service still starts on demand and nothing the
  # machine depends on breaks (owner decision 2026-09-26). Flip `value` to
  # "Disabled" per entry to get the legacy behavior.
  - id: "svc-wsearch-manual"
    description: "Set Windows Search indexer to Manual (stops indexing at boot)"
    name: "WSearch"
    value: "Manual"
    type: "Service"
    category: "services"

  - id: "svc-sysmain-manual"
