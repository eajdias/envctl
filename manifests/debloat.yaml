  # --- Services: stop & disable safe-only set (9 services) ---
  # Spooler (printing), WSearch/SysMain (perf tradeoffs), NgcSvc (Hello),
  # vendor/user services (Dell*, AnyDesk, Firebird*, Tailscale, sshd) and the
  # Xbox suite stay out — see skill windows-debloat for manual steps.
  - id: "svc-diagtrack"
    description: "Stop & disable Connected User Experiences and Telemetry"
    name: "DiagTrack"
    value: "Disabled"
    type: "Service"
    category: "services"

  - id: "svc-wermgr"
    description: "Stop & disable Windows Error Reporting Service"
    name: "wermgr"
    value: "Disabled"
    type: "Service"
    category: "services"

  - id: "svc-mapsbroker"
