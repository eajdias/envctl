    name: "SysMain"
    value: "Manual"
    type: "Service"
    category: "services"

  - id: "svc-ngcsvc-manual"
    description: "Set NgcSvc (Windows Hello credential provider) to Manual"
    name: "NgcSvc"
    value: "Manual"
    type: "Service"
    category: "services"

  - id: "svc-wbengine-manual"
