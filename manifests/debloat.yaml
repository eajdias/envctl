  # --- Startup entries: remove from Run keys + Startup folder (4 entries) ---
  # Conforming = no removable entry; the doctor reports INFO drift, never WARN.
  # Audio services (WavesSvc, RtkAuduService) are deliberately absent: they are
  # driver services and disabling them can break audio on the owner's machine.
  - id: "startup-brave"
    description: "Remove Brave from startup (browser autostart)"
    name: "BraveSoftware"
    type: "StartupItem"
    category: "startup"

  - id: "startup-canva"
    description: "Remove Canva from startup"
    name: "Canva"
    type: "StartupItem"
    category: "startup"

  - id: "startup-microsoftedge"
    description: "Remove MicrosoftEdge from startup (Edge autostart/background)"
    name: "MicrosoftEdge"
    type: "StartupItem"
    category: "startup"

  - id: "startup-securityhealth"
    description: "Remove SecurityHealth from startup (Defender tray placeholder)"
    name: "SecurityHealth"
    type: "StartupItem"
    category: "startup"
