# packages.yaml - Declarative System Packages, Toolchains, Volta Packages & Desktop Apps
version: "1.0"

packages:
  # ============================================================================
  # Core System Runtimes & Package Managers
  # ============================================================================
  - id: Git.Git
    name: Git SCM for Windows
    type: winget
    os: windows
    category: system
    check_command: git --version

  - id: GitHub.cli
    name: GitHub CLI
    type: winget
    os: windows
    category: system
    check_command: gh --version

  - id: Microsoft.PowerShell
    name: PowerShell 7 Core
    type: winget
    os: windows
    category: system
    check_command: pwsh --version

  - id: Docker.DockerDesktop
    name: Docker Desktop
    type: winget
    os: windows
    category: system
    check_command: docker --version

  - id: Microsoft.WSL
    name: Windows Subsystem for Linux (WSL2)
    type: winget
    os: windows
    category: system
    check_command: wsl.exe --status

  # ============================================================================
  # High-Performance CLI Utilities (Winget)
  # ============================================================================
  - id: BurntSushi.ripgrep.MSVC
    name: ripgrep (rg)
    type: winget
    os: windows
    category: cli-tools
    check_command: rg --version

  - id: sharkdp.fd
    name: fd (fast directory find)
    type: winget
    os: windows
    category: cli-tools
    check_command: fd --version

  - id: junegunn.fzf
    name: fzf (fuzzy finder)
    type: winget
    os: windows
    category: cli-tools
    check_command: fzf --version

  - id: sharkdp.bat
    name: bat (cat with syntax highlighting)
    type: winget
    os: windows
    category: cli-tools
    check_command: bat --version

  - id: astral-sh.ruff
    name: ruff (fast python linter & formatter)
    type: winget
    os: windows
    category: cli-tools
    check_command: ruff --version

  - id: astral-sh.uv
    name: uv (fast python package & project manager)
    type: winget
    os: windows
    category: cli-tools
    check_command: uv --version

  - id: dandavison.delta
    name: git-delta (syntax-highlighting pager for git)
    type: winget
    os: windows
    category: cli-tools
    check_command: delta --version

  - id: MikeFarah.yq
    name: yq (portable command-line YAML/JSON/XML processor)
    type: winget
    os: windows
    category: cli-tools
    check_command: yq --version

  # ============================================================================
  # Agent Runtime Helpers (Windows only — Linux/macOS stays isolated: uv/venv)
