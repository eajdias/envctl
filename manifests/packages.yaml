  - id: pyyaml
    name: PyYAML (YAML parsing for python agent scripts)
    type: pip
    os: windows
    category: cli-tools
    check_command: py -m pip show pyyaml

  - id: requests
    name: requests (HTTP client for python agent scripts)
    type: pip
    os: windows
    category: cli-tools
    check_command: py -m pip show requests

  - id: openpyxl
    name: openpyxl (Excel xlsx read/write for python agent scripts)
