# gaming.yaml - Gaming stack for Arch/CachyOS (Steam, emulators, overlays).
# Provisioned via `envctl run cachyos` (full desktop profile) or standalone via
# `envctl run gaming`.
# Requires multilib enabled in /etc/pacman.conf (steam, lib32-*).
# AUR entries need paru + passwordless sudo (see run pre-flight).
# Eden (Switch) is intentionally absent: pinned legacy AppImage, manual install.
version: "1.0"

packages:
  # Steam + runtime
  - id: steam
    name: Steam launcher (multilib)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: gamescope
    name: gamescope compositor for upscaling (FSR)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: mangohud
    name: MangoHud overlay
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: lib32-mangohud
    name: MangoHud overlay (32-bit, Proton)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: ntfs-3g
    name: NTFS read/write (Windows game libraries as cold storage)
    type: pacman
    os: arch,cachyos
    category: gaming

  # Launchers & streaming (homelab inventory 95/50-games: GOG/Epic + mixed
  # catalog + Sunshine/Moonlight vaapi stream to weak clients)
  - id: heroic-games-launcher
    name: Heroic launcher (GOG/Epic)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: lutris
    name: Lutris mixed game catalog/compat
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: sunshine
    name: Sunshine stream host (Moonlight clients)
    type: pacman
    os: arch,cachyos
    category: gaming

  # Standalone emulators (official repos)
  - id: dolphin-emu
    name: Dolphin emulator (GameCube/Wii)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: retroarch
    name: RetroArch frontend
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: ppsspp
    name: PPSSPP emulator (PSP)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: mgba-qt
    name: mGBA emulator (GB/GBC/GBA, Qt frontend)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: snes9x-gtk
    name: Snes9x emulator (SNES, GTK frontend)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: mednafen
    name: Mednafen emulator (PCE/Saturn/PS1 cores)
    type: pacman
    os: arch,cachyos
    category: gaming

  # GPU control
  - id: lact
    name: LACT GPU control daemon (AMD)
    type: pacman
    os: arch,cachyos
    category: gaming

  # AUR binaries (no compilation)
  - id: pcsx2-latest-bin
    name: PCSX2 emulator (PS2, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: duckstation-qt-bin
    name: DuckStation emulator (PS1, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: azahar-appimage
    name: Azahar emulator (3DS, AppImage wrapper)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: melonds-bin
    name: melonDS emulator (NDS, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: flycast-bin
    name: Flycast emulator (Dreamcast/Naomi, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: vita3k-bin
    name: Vita3K emulator (PS Vita, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: cemu-bin
    name: Cemu emulator (Wii U, prebuilt)
    type: paru
    os: arch,cachyos
    category: gaming

  # Proton / Wine runtime (CachyOS optimized builds)
  - id: proton-cachyos-slr
    name: Proton CachyOS SLR (per-game, x86-64 build — never _v3 without AVX2)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: umu-launcher
    name: ULWGL unified launcher (Proton outside Steam)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: wine-cachyos-opt
    name: Wine CachyOS optimized build
    type: pacman
    os: arch,cachyos
    category: gaming

  # CPU / scheduler / power tuning
  - id: scx-tools
    name: sched_ext loader (scx_loader service)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: scx-scheds
    name: sched_ext schedulers (scx_bpfland)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: ananicy-cpp
    name: ananicy-cpp auto-nice daemon (never combine with gamemode)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: power-profiles-daemon
    name: power-profiles-daemon (game-performance wrapper switches to performance in-game)
    type: pacman
    os: arch,cachyos
    category: gaming

  # GPU tools & validation
  - id: goverlay
    name: GOverlay MangoHud configurator
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: amdgpu_top
    name: amdgpu_top AMD GPU monitor
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: vulkan-tools
    name: Vulkan tools (vulkaninfo RADV validation)
    type: pacman
    os: arch,cachyos
    category: gaming

  # Filesystem helpers for game libraries on external disks
  - id: exfatprogs
    name: exFAT userspace tools (external SSD game libraries)
    type: pacman
    os: arch,cachyos
    category: gaming

  # X11 session trio (plasma-x11-session does NOT pull xorg-server — install together)
  - id: plasma-x11-session
    name: KDE Plasma X11 session (lower stutter on Polaris + Proton)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: xorg-server
    name: X.Org server (required by plasma-x11-session, not pulled automatically)
    type: pacman
    os: arch,cachyos
    category: gaming

  - id: xf86-input-libinput
    name: libinput X.Org input driver
    type: pacman
    os: arch,cachyos
    category: gaming

  # Scraper & Switch tooling (AUR binaries, no compilation)
  - id: skyscraper-git
    name: Skyscraper game scraper (ES-DE covers/artwork)
    type: paru
    os: arch,cachyos
    category: gaming

  - id: hactool
    name: hactool (extract Switch ROM keys/content)
    type: paru
    os: arch,cachyos
    category: gaming
