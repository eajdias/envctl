# Ubuntu Server 24.04+ performance profile.
# This file is selected only on exact Ubuntu >= 24.04 hosts by `run performance`.
profile: ubuntu-24.04

packages:
  - id: systemd-zram-generator
    name: systemd-zram-generator (compressed RAM swap)
    type: apt
    os: ubuntu
    target_distro: ubuntu
    min_distro_version: "24.04"
    category: performance

# Conservative server baseline. Values are explicit for review/rollback and do
# not replace workload-specific tuning for databases, storage, or networking.
sysctls:
  - key: vm.swappiness
    value: "10"
    rationale: Keep SSD/server swap pressure conservative; zram remains available under pressure.
  - key: vm.vfs_cache_pressure
    value: "50"
    rationale: Retain inode/dentry cache without the low-cache pressure of aggressive server tuning.
  - key: net.core.somaxconn
    value: "65535"
    rationale: Accept large completed-connection bursts for server workloads.
  - key: net.ipv4.tcp_max_syn_backlog
    value: "4096"
    rationale: Increase the pending SYN queue without an unbounded value.
  - key: fs.file-max
    value: "2097152"
    rationale: Raise the system-wide file descriptor ceiling for parallel server workloads.
