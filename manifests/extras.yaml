# extras.yaml - Optional apps the owner prefers, kept out of the core
# provisioning so the public repo stays neutral. Opt-in via `envctl run extras`
# or `envctl run all --with-extras`; never installed by the default profile.
#
# Zero PII: only package IDs. Business apps, accounts and personal data stay
# out of this repo by design.
#
# Windows entries install via winget; Arch/CachyOS entries via pacman (all
# verified present in the CachyOS repo, no AUR build needed).
#
# Deliberately NOT here (no winget package, self-installer only):
# - RustDesk, Npcap (installer próprio / ARP) -> manual, see docs.
# - WhatsApp, Discord, Spotify (owner's decision: demasiado pessoal).
version: "1.0"

packages:
  # --- Windows (winget) ---
  - id: Brave.Brave
    name: Brave browser
    type: winget
    os: windows
    category: extras

  - id: Obsidian.Obsidian
    name: Obsidian (markdown notes)
    type: winget
    os: windows
    category: extras

