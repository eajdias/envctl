# Skills provisionadas pelo envctl.
#
# Regra de entrada no catalogo: so entra aqui o que o modelo NAO faria sozinho
# (preferencia do usuario, procedimento nao-obvio, armadilha ja paga). Conhecimento de
# ferramenta, receita de projeto e regra obrigatoria vao para `references/` do
# code-playbooks ou para o AGENTS.md. Editar aqui exige atualizar
# docs/skills.md, os SKILL-INDEX e a contagem em internal/infra/embedded/manifest_repo_test.go.
skills:
    - name: agent-memory
      description: "Memoria persistente de licoes e padroes do agente por tier, com fluxo LOAD-ACT-SAVE-REFLECT e promocao de processo a skill"
      source: configs/skills/agent-memory
      target_dir: ""
      enabled: true
    - name: clarify-before-acting
      description: "Mede a ambiguidade do pedido (0-100) e pergunta o minimo antes de executar; tambem quando o alvo e o plano, nao o pedido"
      source: configs/skills/clarify-before-acting
      target_dir: ""
      enabled: true
    - name: code-playbooks
      description: "Conhecimento por stack e ferramenta (Go, Python, Node/Next, SQL, testes, Docker, infra, frontend, MCP/API, docs): indice e leia o arquivo do tema"
      source: configs/skills/code-playbooks
      target_dir: ""
      enabled: true
    - name: envctl
      description: "Operar o envctl: auditar a maquina (doctor), provisionar PC ou VPS, instalar skills/configs de agente"
      source: configs/skills/envctl
      target_dir: ""
      enabled: true
    - name: git-workflow
      description: "Fluxo seguro de Git/GitHub: status, diff, branches, commits convencionais, PR, rebase, merge, stash, tags e worktrees"
      source: configs/skills/git-workflow
      target_dir: ""
      enabled: true
    - name: subagent-routing
      description: "Roteamento de subagentes: quando delegar (inline e o padrao), qual tipo, despacho paralelo no repo e integracao"
      source: configs/skills/subagent-routing
      target_dir: ""
      enabled: true
    - name: subagent-supervision
      description: "Vigiar subagentes: status, coleta, interrupcao e retry, com o vocabulary correto de cada runtime"
      source: configs/skills/subagent-supervision
      target_dir: ""
      enabled: true
    - name: systematic-debugging
      description: "Depuracao sistematica em 4 fases: achar a causa raiz antes de propor correcao, e depois procurar as variantes"
      source: configs/skills/systematic-debugging
      target_dir: ""
      enabled: true
    - name: task-hang-watchdog
      description: "Prevenir e recuperar comando travado: timeout, execucao em background, log persistente e interrupcao pelo id do runtime"
      source: configs/skills/task-hang-watchdog
      target_dir: ""
      enabled: true
    - name: technical-research
      description: "Verificar resposta tecnica com fonte atual, versao explicita e citacao, separando fato, inferencia e desconhecido"
      source: configs/skills/technical-research
      target_dir: ""
      enabled: true
    - name: test-driven-development
      description: "Ciclo TDD red-green-refactor: teste falhando primeiro, codigo minimo depois, em Go, TS/Node ou Python"
      source: configs/skills/test-driven-development
      target_dir: ""
      enabled: true
    - name: writing-plans
      description: "Especificacao e plano passo a passo antes de tocar producao: arquivos afetados, riscos, rollback e verificacao"
      source: configs/skills/writing-plans
      target_dir: ""
      enabled: true
