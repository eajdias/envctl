tweaks:
  - id: "long-paths"
    description: "Enable Win32 Long Paths (260+ character paths)"
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
    name: "LongPathsEnabled"
    value: 1
    type: "DWord"
    category: "system"

  - id: "developer-mode"
    description: "Enable Windows Developer Mode (sideloading & symlinks without elevation)"
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
    name: "AllowDevelopmentWithoutDevLicense"
    value: 1
    type: "DWord"
    category: "system"

  - id: "explorer-show-ext"
    description: "Always show known file extensions in File Explorer"
    path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    name: "HideFileExt"
    value: 0
    type: "DWord"
    category: "explorer"

  - id: "explorer-show-hidden"
    description: "Show hidden files, folders and drives in File Explorer"
    path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    name: "Hidden"
    value: 1
    type: "DWord"
    category: "explorer"

  - id: "dark-mode-apps"
    description: "Enable Dark Theme for Windows Applications"
    path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    name: "AppsUseLightTheme"
    value: 0
    type: "DWord"
    category: "theme"

  - id: "dark-mode-system"
    description: "Enable Dark Theme for Windows System UI"
    path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
    name: "SystemUsesLightTheme"
    value: 0
    type: "DWord"
    category: "theme"

  - id: "meslo-nerd-font"
    description: "Install MesloLGM Nerd Font for Terminal & Editor icons"
    name: "Meslo"
    type: "Font"
    category: "font"
