# Gaming environment baseline for CachyOS (AMD/RADV).
# Deployed by `envctl run shell` (seed only — local additions are preserved).

# Shader cache size: 12G avoids recompiling 1GB+ shader caches every boot.
MESA_SHADER_CACHE_MAX_SIZE=12G
# RADV pipeline library for less shader stutter (already default on recent
# Mesa; explicit for safety).
RADV_PERFTEST=gpl
