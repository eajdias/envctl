# MangoHud preset for gaming on CachyOS (fps + frametime + CPU/GPU/VRAM).
# Deployed by `envctl run shell` (seed only — GOverlay edits are preserved).
# Toggle in-game with Shift+F12. Full option reference ships with mangohud:
# /usr/share/doc/mangohud/MangoHud.conf.example (or configure via GOverlay).

position=top-left
toggle_hud=Shift_L+F12
table_columns=3
background_alpha=0.5

gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
fps
fps_metrics=avg,0.01
frametime
engine_version
vulkan_driver
