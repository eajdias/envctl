# Eden (Switch) — seed provisioned by envctl (seed_if_missing).
# Vulkan + async GPU + async shaders + 1X resolution (CPU-bound) on the
# validated host. Keys/firmware are NOT provisioned: they must be dumped from
# your own console (legal requirement).
backend=1
cpu_backend=0
use_asynchronous_gpu_emulation=true
use_asynchronous_shaders=true
resolution_setup=3
use_vsync=2
scaling_filter=1