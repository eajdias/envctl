version: '3'

vars:
  VERSION:
    sh: git describe --tags --always 2>/dev/null || echo "v1.2.0"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: "Build the standalone envctl executable"
    cmds:
      - go build -ldflags "-s -w -X main.Version={{.VERSION}}" -o envctl.exe ./cmd/envctl

  test:
    desc: "Run all unit tests"
    cmds:
      - go test -v ./...

  coverage:
    desc: "Run tests with coverage report"
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  doctor:
    desc: "Run diagnostic health checks"
    deps: [build]
    cmds:
      - ./envctl.exe doctor

  doctor:fix:
    desc: "Run diagnostics and auto-remediate all issues"
    deps: [build]
    cmds:
      - ./envctl.exe doctor --fix

  run:all:
    desc: "Execute complete end-to-end environment provisioning"
    deps: [build]
    cmds:
      - ./envctl.exe run all

  snapshot:
    desc: "Snapshot current machine state to manifests and configs"
    deps: [build]
    cmds:
      - ./envctl.exe snapshot

  install:
    desc: "Install envctl binary to ~/.local/bin"
    deps: [build]
    cmds:
      - powershell -NoProfile -Command "Copy-Item envctl.exe '$HOME/.local/bin/envctl.exe' -Force"
