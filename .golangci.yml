version: "2"
run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - durationcheck
    - copyloopvar
    - nilerr
  settings:
    errcheck:
      check-blank: true
    gosec:
      excludes:
        - G104  # unhandled errors on deferred close — too noisy for this codebase
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      - linters:
          - gosec
        text: "G304"  # file path from variable — expected in a provisioner
