name: Release Pipeline

# Manual releases: run this workflow from the Actions tab with a version
# (e.g. v1.14.0). It creates the tag and the GitHub release, then builds the
# multi-OS binaries (Windows + Linux) with GoReleaser and attaches them.
# macOS/darwin is not a supported target: no manifest uses it, bootstrap.sh rejects it,
# and the `os:` lint rejects the darwin token, so no darwin binary is built or shipped.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to cut (e.g. v1.14.0)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Attach Multi-OS Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history + tags: goreleaser reads the current tag from git.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate version and create tag
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.14.0, got '$VERSION'" >&2; exit 1 ;;
          esac
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists" >&2; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Release version: ${VERSION}"

      - name: Build and attach assets with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag above is the release: goreleaser creates the GitHub
          # release (default mode) and attaches all 11 assets to it.
          GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.VERSION }}
