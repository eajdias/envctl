name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          go build -ldflags "-s -w -X 'main.Version=$ver'" -o dist/amd64/win11-new.exe ./cmd/win11-new
          Compress-Archive -Path dist/amd64/win11-new.exe -DestinationPath dist/win11-new-windows-amd64.zip

      - name: Build Windows arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          go build -ldflags "-s -w -X 'main.Version=$ver'" -o dist/arm64/win11-new.exe ./cmd/win11-new
          Compress-Archive -Path dist/arm64/win11-new.exe -DestinationPath dist/win11-new-windows-arm64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/win11-new-windows-amd64.zip
            dist/win11-new-windows-arm64.zip
            bootstrap.ps1
          generate_release_notes: true
