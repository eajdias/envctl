name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Multi-OS Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build All Targets
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p dist

          # 1. Windows amd64 & arm64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl.exe ./cmd/envctl
          (cd dist && zip -9 envctl-windows-amd64.zip envctl.exe && rm envctl.exe)

          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl.exe ./cmd/envctl
          (cd dist && zip -9 envctl-windows-arm64.zip envctl.exe && rm envctl.exe)

          # 2. Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl ./cmd/envctl
          tar -czf dist/envctl-linux-amd64.tar.gz -C dist envctl
          rm dist/envctl

          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl ./cmd/envctl
          tar -czf dist/envctl-linux-arm64.tar.gz -C dist envctl
          rm dist/envctl

          # 3. Darwin amd64 & arm64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl ./cmd/envctl
          tar -czf dist/envctl-darwin-amd64.tar.gz -C dist envctl
          rm dist/envctl

          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl ./cmd/envctl
          tar -czf dist/envctl-darwin-arm64.tar.gz -C dist envctl
          rm dist/envctl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/envctl-windows-amd64.zip
            dist/envctl-windows-arm64.zip
            dist/envctl-linux-amd64.tar.gz
            dist/envctl-linux-arm64.tar.gz
            dist/envctl-darwin-amd64.tar.gz
            dist/envctl-darwin-arm64.tar.gz
            bootstrap.ps1
            bootstrap.sh
          generate_release_notes: true
