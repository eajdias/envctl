name: Release Pipeline

# Builds multi-OS binaries and attaches them to the GitHub Release.
# Releases are created by release-please (conventional commits); this workflow
# only builds. It never creates tags — that was the source of the 74-tag pollution.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to (re)build assets for (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Attach Multi-OS Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Fail fast on manual rebuilds of a non-existent release.
          gh release view "$VERSION" >/dev/null
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Release version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build All Targets
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p dist

          # 1. Windows amd64 & arm64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-windows-amd64.exe ./cmd/envctl
          cp dist/envctl-windows-amd64.exe dist/envctl.exe
          (cd dist && zip -9 envctl-windows-amd64.zip envctl.exe && rm envctl.exe)

          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-windows-arm64.exe ./cmd/envctl
          cp dist/envctl-windows-arm64.exe dist/envctl.exe
          (cd dist && zip -9 envctl-windows-arm64.zip envctl.exe && rm envctl.exe)

          # 2. Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-linux-amd64 ./cmd/envctl
          cp dist/envctl-linux-amd64 dist/envctl
          tar -czf dist/envctl-linux-amd64.tar.gz -C dist envctl
          rm dist/envctl

          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-linux-arm64 ./cmd/envctl
          cp dist/envctl-linux-arm64 dist/envctl
          tar -czf dist/envctl-linux-arm64.tar.gz -C dist envctl
          rm dist/envctl

          # 3. Darwin amd64 & arm64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-darwin-amd64 ./cmd/envctl
          cp dist/envctl-darwin-amd64 dist/envctl
          tar -czf dist/envctl-darwin-amd64.tar.gz -C dist envctl
          rm dist/envctl

          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.Version=$VERSION'" -o dist/envctl-darwin-arm64 ./cmd/envctl
          cp dist/envctl-darwin-arm64 dist/envctl
          tar -czf dist/envctl-darwin-arm64.tar.gz -C dist envctl
          rm dist/envctl

      - name: Generate SHA256 Checksums
        run: |
          cp bootstrap.ps1 bootstrap.sh dist/
          cd dist
          sha256sum envctl-windows-amd64.exe envctl-windows-arm64.exe \
            envctl-windows-amd64.zip envctl-windows-arm64.zip \
            envctl-linux-amd64 envctl-linux-arm64 \
            envctl-linux-amd64.tar.gz envctl-linux-arm64.tar.gz \
            envctl-darwin-amd64 envctl-darwin-arm64 \
            envctl-darwin-amd64.tar.gz envctl-darwin-arm64.tar.gz \
            bootstrap.ps1 bootstrap.sh > SHA256SUMS.txt

      - name: Attach Assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          gh release upload "$VERSION" --clobber \
            dist/envctl-windows-amd64.exe \
            dist/envctl-windows-arm64.exe \
            dist/envctl-windows-amd64.zip \
            dist/envctl-windows-arm64.zip \
            dist/envctl-linux-amd64 \
            dist/envctl-linux-arm64 \
            dist/envctl-linux-amd64.tar.gz \
            dist/envctl-linux-arm64.tar.gz \
            dist/envctl-darwin-amd64 \
            dist/envctl-darwin-arm64 \
            dist/envctl-darwin-amd64.tar.gz \
            dist/envctl-darwin-arm64.tar.gz \
            dist/SHA256SUMS.txt \
            bootstrap.ps1 \
            bootstrap.sh
