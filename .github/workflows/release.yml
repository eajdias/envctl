name: Release Pipeline

# Builds multi-OS binaries (Windows + Linux) and attaches them to the GitHub Release.
# macOS/darwin is not a supported target: no manifest uses it, bootstrap.sh rejects it,
# and the `os:` lint rejects the darwin token, so no darwin binary is built or shipped.
# Releases are created by release-please (conventional commits); this workflow
# only builds. It never creates tags — that was the source of the 74-tag pollution.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to (re)build assets for (e.g. v1.4.0)'
        required: true
  # Called by release-please.yml after it creates a release: releases opened
  # with GITHUB_TOKEN do not fire the `release: published` trigger above.
  workflow_call:
    inputs:
      version:
        description: 'Release tag to build assets for (e.g. v1.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Attach Multi-OS Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history + tags: goreleaser reads the current tag from git.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine Version
        id: get_version
        # The two real callers always supply a version (workflow_call passes
        # tag_name; `release: published` carries release.tag_name), so a single
        # fallback chain covers both. Fail fast on a manual rebuild of a
        # non-existent release.
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name }}"
          gh release view "$VERSION" >/dev/null
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Release version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and attach assets with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release-please owns the tag + release notes; goreleaser only
          # attaches assets to the existing release (release.mode:
          # keep-existing + make_latest: false in .goreleaser.yml).
          GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.VERSION }}
