name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    # Inverted filter: docs-only PRs skip, but edits to lint config, Makefile
    # or bootstraps still gate (the old `paths:` list missed exactly those).
    paths-ignore:
      - 'docs/**'
      - 'spec-agent/**'
      - 'CHANGELOG.md'
      - '**.md'
  workflow_dispatch:

# One run per ref: a new push cancels the previous run, so an agent gets the
# verdict for its latest commit instead of waiting on a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads. release.yml owns the write scope
# (tags, releases, assets) and only runs on manual dispatch.
permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint workflows
        # Pinned action (dependabot bumps it weekly). ubuntu-latest ships
        # shellcheck, so the run: scripts inside the workflows are linted too.
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          filter_mode: nofilter
          actionlint_flags: "-color"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Exact pin (not `latest`): a linter release must never redden main
          # with no code change. Dependabot bumps the action tag weekly; bump
          # this string alongside it and the local toolchain.
          version: v2.14.0

  # Runs in parallel with lint on purpose: an agent gets both verdicts from a
  # single run instead of a lint failure hiding whether the tests pass.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Code Quality (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        # Space-separated flag: pwsh splits `-coverprofile=coverage.out` at `=`,
        # making go treat `.out` as a package name.
        run: go test -v -coverprofile coverage.out ./...
      # NOTE: no `go mod download` warm-up and no extra `go build` step — vet
      # and test already compile every package, and the release proves the
      # multi-OS link. This job mirrors `configs/bin/envctl-verify --git-push`
      # (check_soft "blocking" entries); keep the two in sync.
