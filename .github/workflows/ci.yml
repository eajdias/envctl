name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'manifests/**'
      - 'configs/**'
      - '.github/**'
  workflow_dispatch:

# One run per ref: a new push cancels the previous run, so an agent gets the
# verdict for its latest commit instead of waiting on a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads. release-please.yml and release.yml own the
# write scope (releases, assets).
permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download actionlint
        # Pinned release. ubuntu-latest ships shellcheck, so the run: scripts
        # inside the workflows are linted too.
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Lint workflows
        run: ./actionlint -color

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Legacy debt (68 pre-existing findings, mostly Windows/SSH paths
          # untestable on Linux) is tracked for later; the gate blocks only
          # issues introduced by new changes.
          only-new-issues: true

  # Runs in parallel with lint on purpose: an agent gets both verdicts from a
  # single run instead of a lint failure hiding whether the tests pass.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Code Quality (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        # Space-separated flag: pwsh splits `-coverprofile=coverage.out` at `=`,
        # making go treat `.out` as a package name.
        run: go test -v -coverprofile coverage.out ./...

      - name: Build Executable
        run: go build -v ./cmd/envctl
