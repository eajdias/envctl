name: CI Pipeline

on:
  push:
    # main keeps its own gate; the release-please branches are here because a
    # `pull_request` run authored by the bot sits at `action_required` until a
    # maintainer clicks approve (GitHub treats bot actors as outside
    # collaborators), which put an approval click in front of every release. A
    # `push` run needs no approval, and branch protection only cares that the
    # required checks reported on the head SHA — so the release PR stays gated
    # without a human in the loop. Verified: a push to a `release-please--*`
    # branch runs Lint + Test green with no approval step.
    branches: [ main, 'release-please--**' ]
  # Every pull request, not only the ones targeting main: a feature-branch PR is
  # where review actually happens, and filtering on `main` left those PRs with no
  # check at all — the exact gap that let a docs/impl drift ship unverified.
  pull_request:
    # The release PR changes only these two generated files, and it is covered by
    # the push trigger above. Listing them here is what keeps the bot's
    # pull_request run from being created at all — an ignored path means no run,
    # so there is nothing pending approval.
    paths-ignore:
      - 'CHANGELOG.md'
      - '.github/.release-please-manifest.json'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Legacy debt (68 pre-existing findings, mostly Windows/SSH paths
          # untestable on Linux) is tracked for later; the gate blocks only
          # issues introduced by new changes.
          only-new-issues: true

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Code Quality (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        # Space-separated flag: pwsh splits `-coverprofile=coverage.out` at `=`,
        # making go treat `.out` as a package name.
        run: go test -v -coverprofile coverage.out ./...

      - name: Build Executable
        run: go build -v ./cmd/envctl
